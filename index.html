<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#101030">
<title>Glass Skin Tracker</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#101030;--surface:#1a1a42;--card:#1e1e4a;--border:#2e2e6a;
  --gold:#c5a96a;--gold-m:#9a8558;--gold-d:#706040;
  --cream:#e8dcc8;--txt-hi:#ede4d4;--txt-mid:#a8997e;--txt-lo:#6e6252;
  --accent:#3a3a8c;--accent-l:#4e4eae;--today-bg:#2a2a72;
  --green:#6aaa6a;--rose:#b07090;--sky:#6a90c0;--lav:#8a6ab0;--red:#c05050;
}
html,body{background:var(--bg);color:var(--cream);font-family:Georgia,serif;min-height:100vh;overflow-x:hidden}
button{font-family:inherit;cursor:pointer;-webkit-appearance:none;appearance:none}
::-webkit-scrollbar{display:none}

.header{padding:26px 20px 18px;background:linear-gradient(180deg,#16163e,#101030);border-bottom:1px solid var(--border)}
.header-row{display:flex;justify-content:space-between;align-items:flex-start}
.title{font-size:32px;font-weight:400;color:var(--gold);font-style:italic;letter-spacing:1px}
.subtitle{font-size:11px;color:var(--txt-mid);margin-top:5px;font-family:system-ui,sans-serif;letter-spacing:2.5px;text-transform:uppercase}
.streak-box{display:flex;flex-direction:column;align-items:center;border:1px solid var(--border);border-radius:14px;padding:10px 18px;background:var(--surface)}
.streak-num{font-size:22px;font-weight:700;color:var(--gold);font-family:system-ui,sans-serif}
.streak-lbl{font-size:9px;color:var(--txt-mid);font-family:system-ui,sans-serif;text-transform:uppercase;letter-spacing:1.5px}

.week-strip{display:flex;gap:5px;padding:14px 10px;background:var(--surface);border-bottom:1px solid var(--border);overflow-x:auto}
.day-pill{flex:1;min-width:44px;display:flex;flex-direction:column;align-items:center;gap:4px;padding:9px 4px;border-radius:10px;border:1.5px solid transparent;background:transparent;color:var(--txt-mid);font-family:system-ui,sans-serif;font-size:11px;font-weight:600;transition:all .2s}
.day-pill.active{background:var(--today-bg);border-color:var(--accent-l);color:#fff}
.day-pill.today:not(.active){border-color:var(--gold-d);color:var(--gold)}
.micro-bar{width:100%;height:3px;border-radius:2px;background:var(--border);overflow:hidden}
.active .micro-bar{background:rgba(255,255,255,.15)}
.micro-fill{height:100%;border-radius:2px;background:var(--gold);transition:width .3s}
.active .micro-fill{background:#fff}

.day-header{display:flex;justify-content:space-between;align-items:center;padding:18px 20px 10px}
.day-name{font-size:22px;font-weight:400;display:flex;align-items:center;gap:10px}
.today-badge{font-size:10px;color:#fff;background:var(--accent-l);padding:3px 12px;border-radius:20px;font-family:system-ui,sans-serif;font-weight:700;letter-spacing:.5px}
.day-tag{font-size:12px;color:var(--gold);margin-top:3px;font-family:system-ui,sans-serif;letter-spacing:1.5px;text-transform:uppercase;font-weight:600}
.progress-ring{position:relative;width:58px;height:58px;display:flex;align-items:center;justify-content:center}
.progress-text{position:absolute;font-size:14px;font-weight:700;color:var(--gold);font-family:system-ui,sans-serif}

.chip-row{display:flex;flex-wrap:wrap;gap:6px;padding:2px 20px 16px}
.chip{font-size:10px;color:var(--txt-mid);border:1px solid var(--border);padding:4px 12px;border-radius:20px;font-family:system-ui,sans-serif;font-weight:500}

.routines{padding:0 14px 24px}
.period-header{display:flex;align-items:center;gap:8px;padding:10px 0 8px}
.period-icon{font-size:17px}
.period-label{font-size:12px;font-weight:700;color:var(--txt-mid);font-family:system-ui,sans-serif;text-transform:uppercase;letter-spacing:2px}

.step{display:flex;align-items:flex-start;gap:12px;width:100%;background:var(--card);border:1px solid var(--border);border-radius:10px;padding:13px 14px;margin-bottom:7px;text-align:left;transition:all .25s}
.step.done{opacity:.5;background:rgba(30,30,74,.5)}
.step-check{width:22px;height:22px;min-width:22px;border-radius:6px;border:2px solid var(--gold-d);background:transparent;display:flex;align-items:center;justify-content:center;margin-top:1px;transition:all .2s}
.step.done .step-check{border-color:var(--gold);background:var(--gold)}
.check-mark{color:var(--bg);font-size:13px;font-weight:700;display:none}
.step.done .check-mark{display:block}
.step-content{display:flex;flex-direction:column;gap:4px;flex:1}
.step-cat{font-size:10px;font-weight:700;padding:2px 8px;border-radius:5px;align-self:flex-start;font-family:system-ui,sans-serif;text-transform:uppercase;letter-spacing:.8px}
.step-label{font-size:13px;color:var(--cream);line-height:1.45;font-family:system-ui,sans-serif;font-weight:400}
.step.done .step-label{color:var(--txt-lo);text-decoration:line-through}

.cat-cleanse .step-cat{background:#182838;color:#6aaac5}
.cat-device .step-cat{background:#281838;color:#a86ab0}
.cat-treat .step-cat{background:#2a2218;color:#c5a050}
.cat-protect .step-cat{background:#1a2818;color:#6aaa6a}
.cat-moisturise .step-cat{background:#28182a;color:#c06a90}

.cat-cleanse{border-left:4px solid #6aaac5!important}
.cat-device{border-left:4px solid #a86ab0!important}
.cat-treat{border-left:4px solid #c5a050!important}
.cat-protect{border-left:4px solid #6aaa6a!important}
.cat-moisturise{border-left:4px solid #c06a90!important}

.mist{font-size:12px;color:var(--sky);background:rgba(106,144,192,.08);border:1px solid rgba(106,144,192,.2);padding:11px 16px;border-radius:10px;margin:10px 0;font-family:system-ui,sans-serif;text-align:center;font-style:italic}

.spot-toggle{width:100%;display:flex;flex-direction:column;gap:4px;padding:14px;border-radius:10px;border:1.5px dashed var(--border);background:transparent;text-align:left;font-family:system-ui,sans-serif;font-size:13px;font-weight:500;color:var(--cream);transition:all .2s;margin-top:12px}
.spot-toggle.active{border-color:var(--red);background:rgba(192,80,80,.08)}
.spot-hint{font-size:11px;color:var(--txt-mid)}
.spot-step{border-left:4px solid var(--red)!important}
.spot-step .step-cat{background:#2a1818;color:var(--red)}

.panel{margin-top:20px;background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:18px}
.panel-title{font-size:14px;font-weight:600;font-family:system-ui,sans-serif;margin-bottom:10px}
.qure-title{color:var(--lav)}
.qure-count{font-size:12px;color:var(--txt-mid);font-family:system-ui,sans-serif;font-weight:600}
.qure-dots{display:flex;gap:8px;margin-top:14px;justify-content:center}
.qure-dot{width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;font-family:system-ui,sans-serif;transition:all .3s;background:var(--card);color:var(--txt-lo);border:1px solid var(--border)}
.qure-dot.filled{background:var(--lav);color:#fff;border-color:var(--lav)}
.qure-btn{width:100%;margin-top:14px;padding:11px;border-radius:8px;border:none;background:var(--lav);color:#fff;font-family:system-ui,sans-serif;font-size:12px;font-weight:600}
.qure-btn:disabled{background:var(--card);opacity:.5;cursor:default}
.qure-flash{font-size:11px;color:var(--lav);margin-top:8px;font-family:system-ui,sans-serif;text-align:center;font-style:italic;display:none}
.qure-hint{font-size:10px;color:var(--txt-lo);margin-top:10px;font-family:system-ui,sans-serif;text-align:center}

.qure-steps{margin-top:14px;border-top:1px solid var(--border);padding-top:14px}
.qure-steps-title{font-size:11px;font-weight:700;color:var(--lav);font-family:system-ui,sans-serif;text-transform:uppercase;letter-spacing:1.5px;margin-bottom:10px}
.qure-step-item{display:flex;gap:10px;padding:6px 0;font-family:system-ui,sans-serif;font-size:12px;color:var(--txt-mid);line-height:1.5}
.qure-step-num{width:20px;height:20px;min-width:20px;border-radius:50%;background:var(--card);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;color:var(--lav);margin-top:1px}
.qure-warn{font-size:11px;color:var(--gold);background:rgba(197,169,106,.08);border:1px solid rgba(197,169,106,.2);padding:10px 14px;border-radius:8px;margin-top:12px;font-family:system-ui,sans-serif;line-height:1.5}

.tip-title{font-size:13px;font-weight:600;color:var(--gold);font-family:system-ui,sans-serif;margin-bottom:8px}
.tip-text{font-size:12px;color:var(--txt-mid);line-height:1.65;font-family:system-ui,sans-serif}

.rhythm-row{display:flex;align-items:center;gap:10px;padding:5px 0}
.rhythm-day{font-size:11px;font-family:system-ui,sans-serif;font-weight:700;color:var(--txt-mid);width:30px}
.rhythm-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.rhythm-label{font-size:11px;font-family:system-ui,sans-serif;color:var(--cream)}
.rhythm-arrow{font-size:9px;color:var(--accent-l);font-family:system-ui,sans-serif;font-weight:700}

.reset-btn{width:100%;margin-top:22px;padding:11px;border-radius:8px;border:1px solid var(--border);background:transparent;color:var(--txt-lo);font-family:system-ui,sans-serif;font-size:11px;text-transform:uppercase;letter-spacing:1.5px}

.loading{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100vh;background:var(--bg)}
.load-icon{font-size:36px;color:var(--gold);animation:pulse 1.4s infinite}
.load-text{color:var(--txt-mid);margin-top:16px;font-size:14px;font-family:system-ui,sans-serif}
@keyframes pulse{0%,100%{opacity:.4;transform:scale(.9)}50%{opacity:1;transform:scale(1.1)}}
</style>
</head>

am:[{id:"cleanse",label:"Cleanse \u2014 Medicube Zero Foam Cleanser",cat:"cleanse"},{id:"nuface",label:"NuFACE Mini + MicroWand \u2014 lift & depuff",cat:"device"},{id:"toner",label:"Medicube Vitamin C Toner Pad",cat:"treat"},{id:"serum",label:"Pink Peptide Serum via AGE-R Booster Mode",cat:"treat"},{id:"spf",label:"Olay Vitamin C Moisturiser SPF 50",cat:"protect"}],

const TIPS={
Monday:"Steam + clay mask night \u2014 the steamer opens pores so the clay draws out far more impurities. After rinsing the mask, pat dry and go straight into LED on clean skin. Use distilled or filtered water only in the steamer.",
Tuesday:"Air Shot + LED on clean skin before any products. Buffer day between yesterday\u2019s clay and tomorrow\u2019s peel. Full device lineup tonight.",
Wednesday:"Peel night \u2014 kept deliberately simple. No LED, no Derma Shot, no azelaic acid. Collagen Jelly Cream alone tonight \u2014 lighter than Augustinus Bader and better for freshly exfoliated acne-prone skin. On Qure weeks, the micro infusion replaces the peel.",

};

const RHYTHM=[
{d:"Mon",t:"Clay Mask",c:"var(--gold)"},{d:"Tue",t:"Air Shot (buffer)",c:"var(--lav)"},
{d:"Wed",t:"Peel / Qure",c:"var(--rose)"},{d:"Thu",t:"Clay Mask",c:"var(--gold)"},
{d:"Fri",t:"Air Shot (buffer)",c:"var(--lav)"},{d:"Sat",t:"L\u2019Or\u00e9al Peel",c:"var(--rose)"},
{d:"Sun",t:"Rest & Repair",c:"var(--green)"}
];

const QURE_STEPS=[
  "Wash hands thoroughly. Cleanse face, remove all makeup and product. Pat completely dry.",
  "Spritz Qure Hypochlorous Acid Dermal Mist over face. Wait until fully dry before proceeding.",
  "Twist open the Micro-Infusion device. Pour one full ampoule of Qure serum into the chamber.",
  "Attach the sterile needle head with the plastic cap still on. Turn device upside down for 1\u20132 minutes to let serum saturate the needles.",
  "Remove the cap. Start at the centre of the face and stamp outward with light pressure. Use 50% overlap (each stamp overlaps the previous one halfway).",
  "Pat any excess serum from the device into your face and neck \u2014 let it soak into the microchannels.",
  "Place the lid back on the needle head and dispose of it safely.",
  "Follow with Augustinus Bader The Cream only \u2014 skip all other serums and actives tonight.",

let sel,checks={},streak=0,qure=0,spotActive=false,qureExpanded=false;

function wk(){const n=new Date(),s=new Date(n.getFullYear(),0,1),w=Math.ceil(((n-s)/864e5+s.getDay()+1)/7);return`w-${n.getFullYear()}-${w}`;}
function todayIdx(){const d=new Date().getDay();return d===0?6:d-1;}
function key(dn,p,sid){return`${wk()}:${dn}:${p}:${sid}`;}
function chk(dn,p,sid){return!!checks[key(dn,p,sid)];}
function toggle(dn,p,sid){const k=key(dn,p,sid);checks[k]=!checks[k];if(!checks[k])delete checks[k];save();render();}

function prog(dn){
  const d=R[dn];let tot=d.am.length+d.pm.length,done=0;
  d.am.forEach(s=>{if(chk(dn,"am",s.id))done++;});
  d.pm.forEach(s=>{if(chk(dn,"pm",s.id))done++;});
  if(spotActive&&dn===DAYS[sel]){tot++;if(chk(dn,"pm","spottreat"))done++;}
  return{done,tot,pct:tot>0?Math.round(done/tot*100):0};
}

function save(){try{localStorage.setItem("gs-checks",JSON.stringify(checks));localStorage.setItem("gs-streak",streak);localStorage.setItem("gs-qure",qure);}catch(e){}}
function load(){try{const c=localStorage.getItem("gs-checks");if(c)checks=JSON.parse(c);const s=localStorage.getItem("gs-streak");if(s)streak=+s;const q=localStorage.getItem("gs-qure");if(q)qure=+q;}catch(e){}}

function logQure(){if(qure>=6)return;qure++;save();render();setTimeout(()=>{const f=document.getElementById("qure-flash");if(f)f.style.display="block";setTimeout(()=>{if(f)f.style.display="none";},3000);},50);}

function toggleQureSteps(){qureExpanded=!qureExpanded;render();}

function resetWeek(){const w=wk();const nc={};Object.keys(checks).forEach(k=>{if(!k.startsWith(w))nc[k]=checks[k];});checks=nc;save();render();}

function stepHTML(step,period,isSpot){
  const done=chk(DAYS[sel],period,step.id);
  const cls=`step cat-${step.cat} ${done?"done":""} ${isSpot?"spot-step":""}`;
  return`<button class="${cls}" onclick="toggle('${DAYS[sel]}','${period}','${step.id}')">
    <div class="step-check"><span class="check-mark">\u2713</span></div>
    <div class="step-content">
      <span class="step-cat">${CAT_ICONS[step.cat]||"\u{1F3AF}"} ${isSpot?"spot treatment":step.cat}</span>
      <span class="step-label">${step.label}</span>
    </div>
  </button>`;
}

function render(){
  const dn=DAYS[sel],dd=R[dn],p=prog(dn),isToday=sel===todayIdx();
  const dashLen=(p.pct/100)*150.8;

  let html=`
  <div class="header"><div class="header-row">
    <div><h1 class="title">Glass Skin</h1><p class="subtitle">Weekly Regimen Tracker</p></div>
    <div class="streak-box"><span class="streak-num">${streak}</span><span class="streak-lbl">streak</span></div>
  </div></div>

  <div class="week-strip">
    ${DAYS.map((d,i)=>{
      const dp=prog(d);
      let cls="day-pill";if(i===sel)cls+=" active";if(i===todayIdx()&&i!==sel)cls+=" today";
      return`<button class="${cls}" onclick="sel=${i};render()">
        <span>${DS[i]}</span>
        ${dp.pct>0?`<div class="micro-bar"><div class="micro-fill" style="width:${dp.pct}%"></div></div>`:""}
        ${dp.pct===100?`<span style="font-size:9px;color:var(--green)">\u2713</span>`:""}
      </button>`;
    }).join("")}
  </div>

  <div class="day-header">
    <div>
      <div class="day-name">${dn}${isToday?`<span class="today-badge">Today</span>`:""}</div>
      <div class="day-tag">${dd.tag}</div>
    </div>
    <div class="progress-ring">
      <svg width="58" height="58" viewBox="0 0 58 58">
        <circle cx="29" cy="29" r="24" fill="none" stroke="var(--border)" stroke-width="4"/>
        <circle cx="29" cy="29" r="24" fill="none" stroke="var(--gold)" stroke-width="4"
          stroke-dasharray="${dashLen} 150.8" stroke-linecap="round" transform="rotate(-90 29 29)"
          style="transition:stroke-dasharray .4s"/>
      </svg>
      <span class="progress-text">${p.pct}%</span>
    </div>
  </div>

  <div class="chip-row">${dd.devices.map(d=>`<span class="chip">${d}</span>`).join("")}</div>

  <div class="routines">
    <div class="period-header"><span class="period-icon">\u2600\uFE0F</span><span class="period-label">Morning Routine</span></div>
    ${dd.am.map(s=>stepHTML(s,"am",false)).join("")}

    <div class="mist">\u{1F4A6} Midday: spritz Pink Peptide Serum Mist Spray for hydration boost</div>

    <div class="period-header" style="padding-top:16px"><span class="period-icon">\u{1F319}</span><span class="period-label">Evening Routine</span></div>
    ${dd.pm.map(s=>stepHTML(s,"pm",false)).join("")}

    <button class="spot-toggle ${spotActive?"active":""}" onclick="spotActive=!spotActive;render()">
      <span>\u{1F3AF} Acne Spot Treatment</span>
      <span class="spot-hint">${spotActive?"Active \u2014 check off after applying":"Tap if you have active pimples tonight"}</span>
    </button>
    ${spotActive?`<div style="margin-top:7px">${stepHTML({id:"spottreat",label:"Apply pimple patch or spot treatment \u2014 avoid Derma Shot on inflamed areas",cat:"treat"},"pm",true)}</div>`:""}

    <!-- QURE SECTION -->
    <div class="panel">
      <div style="display:flex;justify-content:space-between;align-items:center">
        <span class="panel-title qure-title" style="margin-bottom:0">\u2B21 Qure Micro Infusion</span>
        <span class="qure-count">${qure}/6</span>
      </div>
      <div style="font-size:11px;color:var(--txt-mid);font-family:system-ui,sans-serif;margin-top:4px">
        Every 2 weeks on Wednesday PM \u2014 replaces L\u2019Or\u00e9al peel that night
      </div>
      <div class="qure-dots">
        ${[1,2,3,4,5,6].map(n=>`<div class="qure-dot ${n<=qure?"filled":""}">${n}</div>`).join("")}
      </div>
      ${dn==="Wednesday"?`<button class="qure-btn" onclick="logQure()" ${qure>=6?"disabled":""}>${qure>=6?"All 6 treatments complete \u2713":"Log Qure treatment tonight (replaces peel)"}</button>`:""}
      <p class="qure-flash" id="qure-flash">Logged! Tonight: cleanse \u2192 Qure steps below \u2192 Augustinus Bader only. Skip peel, LED & all other devices.</p>

      <!-- Expandable steps -->
      <button onclick="toggleQureSteps()" style="width:100%;margin-top:14px;padding:10px;border-radius:8px;border:1px solid var(--border);background:var(--card);color:var(--cream);font-family:system-ui,sans-serif;font-size:12px;font-weight:600;display:flex;justify-content:space-between;align-items:center">
        <span>\u{1F4CB} Qure Treatment Steps</span>
        <span style="color:var(--lav);font-size:14px">${qureExpanded?"\u25B2":"\u25BC"}</span>
      </button>
      ${qureExpanded?`
      <div class="qure-steps">
        <div class="qure-steps-title">Step-by-step guide</div>
        ${QURE_STEPS.map((s,i)=>`<div class="qure-step-item"><div class="qure-step-num">${i+1}</div><div>${s}</div></div>`).join("")}
        <div class="qure-warn">\u26A0\uFE0F On Qure nights: skip the L\u2019Or\u00e9al peel, LED mask, Derma Shot, and all other actives. Only Augustinus Bader The Cream after the treatment. Extra SPF the next morning is essential.</div>
      </div>`:""}

      <p class="qure-hint">6 treatments over ~12 weeks. Next morning: extra diligent SPF.</p>
    </div>

    <!-- TIP -->
    <div class="panel" style="margin-top:18px">
      <div class="tip-title">\u{1F4A1} ${dn} Tip</div>
      <p class="tip-text">${TIPS[dn]}</p>
    </div>

    <!-- WEEKLY RHYTHM -->
    <div class="panel" style="margin-top:18px">
      <div class="tip-title" style="color:var(--gold)">\u{1F4C5} Weekly Rhythm</div>
      ${RHYTHM.map((r,i)=>`<div class="rhythm-row" style="opacity:${i===sel?1:.55}">
        <span class="rhythm-day">${r.d}</span>
        <div class="rhythm-dot" style="background:${r.c}"></div>
        <span class="rhythm-label">${r.t}</span>
        ${i===sel?`<span class="rhythm-arrow">\u25C0</span>`:""}
      </div>`).join("")}
    </div>

    <button class="reset-btn" onclick="resetWeek()">Reset this week</button>
    <div style="height:60px"></div>
  </div>`;

  document.getElementById("app").innerHTML=html;
}

sel=todayIdx();
load();
render();
</script>
</body>
</html>
